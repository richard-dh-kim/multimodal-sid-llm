[project]
name = "sid-llm"
version = "0.1.0"
description = "Multimodal generative retrieval over Semantic IDs"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "lightning>=2.4.0",
    "transformers>=4.51.0",
    "accelerate>=0.34.0",
    "vector-quantize-pytorch>=1.17.0",
    "faiss-cpu>=1.8.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "wandb>=0.18.0",
    "gradio>=4.44.0",
    "pyarrow>=18.0.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "aiohttp>=3.10.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sid_llm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
